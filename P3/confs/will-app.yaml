apiVersion: apps/v1
kind: Deployment
metadata:
  name: will-app
  namespace: dev
spec:
  selector:
    matchLabels:
      app: will-app
  replicas: 1
  template:
    metadata:
      labels:
        app: will-app
    spec:
      containers:
        - name: will
          image: wil42/playground:v1
          ports:
            - containerPort: 8888
---
apiVersion: v1
kind: Service
metadata:
  name: will-service
  namespace: dev
spec:
  type: NodePort
  selector:
    app: will-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8888
      nodePort: 30888