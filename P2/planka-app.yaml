apiVersion: apps/v1
kind: Deployment
metadata:
  name: planka-deployment
spec:
  selector:
    matchLabels:
      app: planka
  replicas: 1
  template:
    metadata:
      labels:
        app: planka
    spec:
      containers:
        - name: planka
          image: ghcr.io/plankanban/planka:latest
          ports:
            - containerPort: 1337
          envFrom:
            - secretRef:
                name: secret
---
apiVersion: v1
kind: Service
metadata:
  name: planka-service
spec:
  type: NodePort
  selector:
    app: planka
  ports:
    - protocol: TCP
      port: 1337
      targetPort: 1337
      nodePort: 30000