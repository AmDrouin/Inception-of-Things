apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-deployment
spec:
  selector:
    matchLabels:
      app: immich
  replicas: 3
  template:
    metadata:
      labels:
        app: immich
    spec:
      containers:
      - name: immich
        image: ghcr.io/immich-app/immich-server
        ports: 
        - containerPort: 2283
